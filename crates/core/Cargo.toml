[package]
name = "musiclab-core"
description = "MusicLab 原生引擎：DSP 分离、WAV→MIDI 转录、任务管理（纯 Rust，无 GUI 依赖）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hound = "3"
rustfft = "6"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
