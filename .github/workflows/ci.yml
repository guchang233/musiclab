name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: 跑测试
        run: pytest -q

  build-check:
    name: 构建检查（sdist + wheel）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 构建
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
