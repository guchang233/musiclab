name: Release

# 打 tag（v*）自动触发：测试 → 编译（Python 包 + Windows exe + Tauri 壳）→ 发布 GitHub Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 发布前测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - run: pytest -q

  build-python:
    name: 编译 Python 包（sdist + wheel）
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  build-windows:
    name: 编译 Windows exe（PyInstaller）
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller

      - name: 打包单文件 exe
        run: >
          pyinstaller --noconfirm --clean --onefile --name musiclab
          --paths .
          --collect-all librosa --collect-all soundfile --collect-all mido
          musiclab/cli.py

      - name: 冒烟测试（后端诊断）
        run: dist/musiclab.exe backends

      - uses: actions/upload-artifact@v4
        with:
          name: musiclab-exe
          path: dist/musiclab.exe
          if-no-files-found: error

  build-tauri:
    name: 编译 Tauri 壳（Linux deb）
    needs: test
    runs-on: ubuntu-22.04
    # Tauri 依赖系统 webkit，构建失败不阻塞 Python 包发布
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖（webkit2gtk 等）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 deb 包
        working-directory: ui
        run: cargo tauri build --bundles deb

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: tauri-deb
          path: ui/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  release:
    name: 发布 GitHub Release
    needs: [build-python, build-windows, build-tauri]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: musiclab-exe
          path: exe/

      - uses: actions/download-artifact@v4
        with:
          name: tauri-deb
          path: tauri/
        continue-on-error: true  # Tauri 失败不阻塞发布

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            exe/musiclab.exe
            tauri/*.deb
