[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musiclab"
version = "0.1.0"
description = "音乐工作站内核：音源分离 + WAV→MIDI 转录引擎"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "mido>=1.3",
]

[project.optional-dependencies]
# 重型 ML 后端按需安装，缺失时引擎自动降级到 DSP 后端
demucs = ["demucs>=4.0"]
basic-pitch = ["basic-pitch>=0.4"]
all = ["demucs>=4.0", "basic-pitch>=0.4"]
dev = ["pytest>=7"]

[project.scripts]
musiclab = "musiclab.cli:main"

[tool.setuptools.packages.find]
include = ["musiclab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
